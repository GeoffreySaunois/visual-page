<!DOCTYPE html>
<html lang="fr" data-theme="auto" data-palette="navy" data-resolved-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galerie</title>
{{FAVICON}}
<script>
/* Anti-flash: the pages' stored appearance and sidebar state land on <html>
   before the first paint, under the same keys, so the gallery and the pages
   always open dressed alike. Storage may throw: the defaults then apply. */
(function () {
  var root = document.documentElement;
  function stored(key) { try { return localStorage.getItem(key); } catch (error) { return null; } }
  var mode = stored("vr-theme");
  if (mode !== "light" && mode !== "dark") mode = "auto";
  var palette = stored("vr-palette");
  if (palette !== "violet" && palette !== "grey") palette = "navy";
  var dark = mode === "dark" || (mode === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme", mode);
  root.setAttribute("data-palette", palette);
  root.setAttribute("data-resolved-theme", dark ? "dark" : "light");
  if (stored("vr-sidebar") === "collapsed") root.classList.add("sidebar-collapsed");
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
{{STYLES}}
</style>
</head>
<body class="gallery-page">
{{ICONS}}
<div class="vr-app">
<aside class="sidebar" id="sidebar" aria-label="Dossiers de la galerie">
  <div class="brand">
    <a class="brand-link" href="#/" title="Toutes les pages">
      <svg class="brand-mark" aria-hidden="true"><use href="#vr-mark"></use></svg><span class="label">Galerie</span>
    </a>
    <button type="button" class="icon-button sidebar-collapse" id="sidebar-collapse" aria-label="Replier la barre latérale" aria-controls="sidebar" aria-expanded="true">
      <svg class="icon icon-when-open" aria-hidden="true"><use href="#vr-i-panel-left-close"></use></svg>
      <svg class="icon icon-when-collapsed" aria-hidden="true"><use href="#vr-i-panel-left"></use></svg>
    </button>
  </div>
  <div class="sidebar-body">
    <a class="rail-link" href="#/" aria-label="Toutes les pages">
      <svg class="icon" aria-hidden="true"><use href="#vr-i-library"></use></svg>
    </a>
    {{TREE}}
  </div>
</aside>
<button type="button" class="sidebar-shade" id="sidebar-shade" aria-label="Fermer la barre latérale" hidden></button>

<div class="vr-main">
  <header class="reader-header">
    <button type="button" class="icon-button mobile-menu" id="mobile-menu" aria-label="Ouvrir la barre latérale" aria-controls="sidebar" aria-expanded="false">
      <svg class="icon" aria-hidden="true"><use href="#vr-i-menu"></use></svg>
    </button>
    <a class="icon-button back-to-folder" id="gallery-up" href="#/" aria-label="Dossier parent" hidden>
      <svg class="icon" aria-hidden="true"><use href="#vr-i-arrow-left"></use></svg>
    </a>
    <div class="reader-title">
      <nav class="reader-crumbs" id="gallery-crumbs" aria-label="Emplacement" hidden></nav>
      <h1 class="reader-heading" id="gallery-heading">Galerie</h1>
    </div>
    <div class="reader-toolbar" role="toolbar" aria-label="Actions de la galerie">
      {{APPEARANCE_TOGGLE}}
    </div>
  </header>

  <div class="gallery" role="main">
    <div class="gallery-tools">
      <label class="search-field">
        <svg class="icon" aria-hidden="true"><use href="#vr-i-search"></use></svg>
        <span class="visually-hidden">Rechercher dans toute la galerie</span>
        <input type="search" id="search" placeholder="Rechercher dans toute la galerie…" autocomplete="off">
      </label>
      <div class="sorts" id="sorts" role="group" aria-label="Ordre des pages">
        <button type="button" data-sort="date" aria-pressed="true">Récentes</button>
        <button type="button" data-sort="date-asc" aria-pressed="false">Anciennes</button>
        <button type="button" data-sort="title" aria-pressed="false">A–Z</button>
      </div>
    </div>
    <p class="search-summary" id="search-summary" aria-live="polite" hidden></p>
    <div id="archive">
{{DIRECTORIES}}
    </div>
    <p class="no-results" id="no-results" hidden>Aucune page ne correspond.</p>
  </div>
</div>
</div>

{{APPEARANCE_MENU}}

{{SCRIPTS}}
</body>
</html>
