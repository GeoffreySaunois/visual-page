[project]
name = "visualreport"
version = "0.2.0"
description = "Compile markdown sources into self-contained HTML report pages, with a local comment loop between Geoffrey and Claude"
requires-python = ">=3.12"
dependencies = [
    "markdown==3.10.2",
    "pymdown-extensions==11.0.1",
    "pygments==2.20.0",
    "pyyaml==6.0.3",
    "pydantic==2.13.4",
    "fastapi==0.139.0",
    "uvicorn==0.50.0",
    "google-cloud-firestore==2.28.1",
    "google-cloud-storage==3.13.1",
    "pyjwt[crypto]==2.13.0",
]

[project.scripts]
visual-report = "visualreport.cli:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pip-audit==2.10.1",
    "pytest==8.4.2",
    "ruff==0.16.4",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visualreport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
